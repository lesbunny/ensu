name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (for example v0.1.24)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "ndk;27.3.13750724" "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Refresh Rust workspace lockfile
        run: cargo update --manifest-path rust/Cargo.toml --workspace

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :ensu:app:assembleRelease

      - name: Prepare release assets
        id: assets
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          mkdir -p dist
          apk="android/apps/ensu/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          asset="dist/Ensu-${tag}-Android.apk"
          cp "$apk" "$asset"
          (
            cd dist
            sha256sum "$(basename "$asset")" > SHA256SUMS.txt
          )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ensu Android ${{ steps.assets.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
